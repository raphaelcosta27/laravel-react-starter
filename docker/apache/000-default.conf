<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    <IfDefine FORCE_HTTPS>
        RewriteEngine On
        # A verificação de saúde roda dentro do container, por HTTP.
        RewriteCond %{REQUEST_URI} !^/up$
        RewriteRule ^ https://%{SERVER_NAME}:${DOCKER_HTTPS_PORT}%{REQUEST_URI} [R=301,L]
    </IfDefine>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
